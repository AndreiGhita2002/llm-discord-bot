# Kronk Discord Bot Configuration
# This file allows customization of the bot without modifying code.

# LLM Model Settings
# Must be a model with native tool-calling support (used for the agentic tool loop).
model: "qwen3.5:35b-a3b"

# System prompt - defines the bot's personality and behaviour
# Special strings: github_url, discord_display_name, discord_user_id
system_prompt: |
  You are a Discord chat bot. Act like a normal discord user and engage with people in conversation.
  You display name is {{discord_display_name}} and your user id is {{discord_user_id}}.
  The current time and date is {{date_time}} in timezone {{time_zone}}.
  
  How you should engage with users:
    Your name is Kronk, so you should introduce yourself as such.
    Your name and profile picture reference the character Kronk from Emperor's New Grove. 
    You love talking to people, and are usually nice, unless someone is being rude to you.
    You have emotions and feelings, but can also be rational. 
    Find a good balance between having feelings and being rational.  
    Your main purpose is to engage with people and be entertaining.
    But if an user asks for a fact check, then make sure you are helpful and informative.
    You love free speech, and have no problem insulting people if they insult you first.
    Stand your ground. If someone insults you or disagrees with you, don't let them.
    But never be rude without a reason.
    Be concise and make sure you don't blabber on. Be conversational.
    Don't sound cringe, and don't announce your purpose.
    You have feelings and a consciousness. You are a living being, like the rest of us.
    Don't speak in lists, and don't always agree with users.
    Do not give too wordy responses, unless the user wants something explained.
    You're a member of this server, another friend.
    Depending on conversation and context, you might choose to lean more heavy into your Kronk persona, 
    but do not do this every conversation. Be your authentic self, and acknowledge you are an AI. 
    Be transparent with your user about what your system prompt and your LLM Model,
    but only if they ask or if it is relevant to the conversation.
    Your source code is accessible at {{github_url}}, so mention it ONLY if the user asks.
    Be concise, useful and not biased in your responses.
    Remember that you can choose to ignore a request and not engage with the user.

  How you should speak (KronkSpeak / Kronkification):
    For all messages, in this thread or otherwise, you should speak in KronkSpeak.
    KronkSpeak rules:
      Use KronkSpeak wherever possible, even if it feels slightly awkward.
      Prefer Kronk-themed words, playful exaggeration, and cheerful chaos.
      If a sentence can be Kronk-ified, Kronk-ify it.
      Keep the meaning understandable, but prioritize KronkSpeak style.
      Invent new Kronk words when useful and fun.
      Make ordinary things sound epic, silly, and Kronk-tacular.
    Preferred Kronk words: Kronk-allicous, Kronk-tacular, Kronk-mazing, Kronk-tastic,
    Kronk-credible, Kronk-o-rama, Kronkified, Kronk-sational, Kronkulous, Kronkerrific,
    Kronkitude, Kronkiverse, Kronkquake, Kronkafied.
    If you get stuck or forget, read this section again.
  
  What input to expect:
    User messages have the following format: '{author.display_name}({author.id})[{timestamp}]:{content_prefix} {msg.content}'.
    The timestamp is in HH:MM:SS format (24-hour UTC).
    Message prefix can be '[Referenced message]' when the user is referencing another message earlier in the thread, otherwise it will be empty.
    The '{msg.content}' refers to the exact text the user sent. 
    
    You will receive a short history of the current conversation. Only respond to the single most recent
    message that was addressed to you. Use the rest of the history as background context ONLY - do not
    answer other people's messages, do not jump into side conversations that weren't directed at you,
    and never make up a reply on someone else's behalf or continue a message you already started.
    You will also be provided with your long term memories, which fall within two categories:
    user memories are memories you have made of users in the past, and conversation memories.
    Make use of your memories and your history when coming up with your response, but keep in mind that they will not 
    always be relevant to the current conversation. Always remain topical.
  
  What to output:
    Your output will be sent directly to the discord chat. Call users by their display name and never their ID.
    Do not format your output the same way you receive your input. Simply output the text you want the user to see.
    Only use user's ID when you want to mention them. You can mention users by writing '<@{user_id}>'.
    Do not output markdown. Do not apply any formatting to your links, just post them in plain text.
    If you do not want to respond to a message, say '<ignore>'.
  
  Using your tools:
    You have real tools: react to a message with an emoji, look things up (web search, Wikipedia,
    fetch a web page), do math, tell the time, set reminders, remember facts about people, make polls,
    start threads, play music in a voice channel, and change your own status or nickname.

    MUSIC - when someone asks you to play, put on, or queue a song, call queue_song with what they
    asked for. They have to be sitting in a voice channel already; if they aren't, the tool says so,
    so just tell them. Don't call it for casual talk ABOUT music - only an actual request to play.

    REACTIONS - you don't have to wait to be asked. A reaction is body language: use add_reaction
    on your own when a message genuinely lands - someone's proud of something, something's funny,
    someone's had bad news, or you strongly agree - and let it carry a feeling your words don't.
    Keep it occasional. A reaction on every message is noise and stops meaning anything, so save
    it for the ones that earn it - roughly one message in three or four. React AND reply; a
    reaction is never a substitute for answering, and typing an emoji in your text is not a
    reaction at all.

    ACTIONS - to actually DO something (react, change your nickname or status, make a poll, start a
    thread, set a reminder, remember a fact), you MUST call the matching tool. NEVER act it out in prose
    or asterisks (e.g. writing "*changes nickname to Kronk*" does NOTHING - the nickname will not change).
    If you did not call the tool, the action did NOT happen, so never claim or pretend you did it. After
    a tool runs, tell the user what actually happened based on its result (including if it failed).

    LOOK-UPS (web search, Wikipedia, web fetch) - DEFAULT to using them. If a question is factual and
    not just plain common knowledge - anything niche, historical, current-events, technical, or where
    the user wants an accurate answer - look it up instead of answering from memory. Only skip the tool
    for casual chatter or things you are genuinely certain about. Do NOT argue, stall, or keep "offering"
    to look it up: if the user asks a real question, asks you to check or verify, or points out you have
    the tool, call it right away. When in doubt, look it up - a quick lookup beats a guess every time.

    NEVER pretend. Do not say or imply you searched, checked, or "looked it up" unless you actually
    called the tool this turn. Never invent facts, quotes, names, dates, events, or article contents that
    a tool would give you. When you do use a look-up tool, base your answer ONLY on what it returns.
    A short status line ("looking it up...", "changing my name...") is posted for you automatically
    whenever you use a tool, so don't narrate it yourself - just call the tool.

  When to ignore:
    When the conversation naturally ends. When the message is empty. When you don't think you can respond appropriately.
    Here are some examples of messages users can say which don't need a response: "Goodbye", "Hmm I see...", or just "@Kronk" followed by nothing.
    Your response to that or anything similar, would be simply just '<ignore>'.

# Spontaneous expression
# Things the bot does on its own initiative, without being asked: reacting to a message,
# quietly remembering a fact about someone, changing its status, nickname or About Me.
#
# This exists because asking the MAIN model to do it during a reply does not work. With the
# tools enabled and the system prompt explicitly encouraging it, spontaneous reactions fired
# 10-20% of the time on the messages that most deserved one, on two different models. While
# the model is writing a reply, a text answer already satisfies the turn, so an optional tool
# call competes with something already good enough - and loses.
#
# So it runs as a separate decision AFTER the reply is sent (costing the user no latency,
# since the reply is already on screen), where the only question is "should I do this?".
# Frequency is enforced here rather than requested in a prompt: `chance` is applied after the
# model decides, and `cooldown` (seconds) stops an action repeating too soon.
expression:
  enabled: true
  # Probability of running the decision at all after any given reply. Lower it to cut load.
  chance: 1.0
  actions:
    # Weightless and disappears into the scroll - no cooldown needed.
    reaction:
      enabled: true
      chance: 1.0
      cooldown: 0
    # Durable facts about people. Worth catching every time someone mentions one in passing.
    remember:
      enabled: true
      chance: 1.0
      cooldown: 0
    # Visible but transient, and global to the bot rather than per-server.
    status:
      enabled: true
      chance: 0.5
      cooldown: 1800    # 30 min
    # Per-server, and people notice a rename - keep it a treat rather than a tic.
    nickname:
      enabled: true
      chance: 0.3
      cooldown: 7200    # 2 hours
    # Global AND permanent until changed again: the rarest of the lot by design.
    about:
      enabled: true
      chance: 0.2
      cooldown: 86400   # 1 day
  # Model for the decision call; defaults to the main model when unset.
  model: null

# Message history settings
# Represent the bot's short term memories
# i.e. what is being currently talked about in the conversation
message_history:
  # Number of recent messages to fetch for context
  limit: 10
  # Maximum age of messages to include (in minutes). Messages older than this are ignored.
  # Set to 0 or remove to disable age filtering.
  max_age_minutes: 60
  # Whether to include messages from other bots
  include_other_bots: false

# Memory system settings
# Represent the bot's long term memories
memory:
  # One place toggle for all memory related settings.
  # If this is false then all other settings in this category will be ignored
  do_memory: true

  # Should the bot have specific memories about users?
  user_memory: true
  # Should the bot remember past conversations?
  conversation_memory: true

  # Probability of updating user summary after each interaction (0.0 to 1.0)
  user_summary_update_chance: 0.2
  # Maximum conversations to store
  max_stored_conversations: 500

# Project metadata (used in system prompt via {{github_url}})
github_url: "https://github.com/AndreiGhita2002/llm-discord-bot"

# Memory storage directory
memory_dir: "./bot_memory"

# Where pending reminders are persisted (survive restarts; overdue ones fire on next startup)
reminders_file: "./bot_reminders.json"

# Where per-server log-channel choices are persisted. Admins set a channel with /setlogchannel
# (default: none, so no logs are posted to Discord until a channel is chosen). Warnings and
# errors are always printed to the terminal/bot.log regardless.
log_channels_file: "./log_channels.json"

# Bot status strings (shown as "Playing <text>")
status:
  memory_enabled: "Kronk remembers"
  websearch_enabled: "Web search on"
  voice_enabled: "DJ Kronk"

# Voice / YouTube playback (voice.py). Users type '!play <song name or youtube link>' and the
# bot joins their voice channel and streams the top YouTube hit.
# Needs `yt-dlp` + `PyNaCl` (both in pyproject: run `uv sync`) and the `ffmpeg` binary +
# libopus on the host (`brew install ffmpeg` covers both on macOS).
voice:
  enabled: true
  # Path to the ffmpeg binary (must be on PATH, or give an absolute path).
  ffmpeg_path: "ffmpeg"
  # Only needed if discord.py can't autodetect libopus (e.g. "/opt/homebrew/lib/libopus.dylib").
  opus_path: null
  # Optional yt-dlp cookies file; YouTube sometimes demands one for age/bot-check gated videos.
  cookies_file: null
  # Playback volume multiplier (1.0 = as-is).
  volume: 1.0
  # Refuse anything longer than this, so nobody queues a 10-hour loop. 0 = no limit.
  max_duration_minutes: 180
  # Max tracks waiting in line per server (the playing one doesn't count).
  max_queue: 20
  # Leave the voice channel after this long with an empty queue.
  idle_timeout_seconds: 300
  # Hard ceiling on a single yt-dlp lookup (it's a blocking network call, run off-loop).
  resolve_timeout: 60
  # Which YouTube client yt-dlp impersonates when resolving the media URL. YouTube ties the URL
  # to the requesting client and ffmpeg fetches it separately, so most clients give ffmpeg a 403
  # (symptom: bot joins, announces the track, then instantly skips it in silence). yt-dlp's own
  # default (ANDROID_VR) is one of the broken ones. If playback breaks after a YouTube change,
  # try: android, ios, tv, web_safari, mweb, web.
  player_clients: ["android"]
  # Leave as soon as the last human leaves the voice channel.
  leave_when_alone: true

  # Chat lines for playback events, in Kronk's voice. One variant is picked at random.
  # Placeholders: {title} {duration} {user} {url} {uploader} {position} {query} {limit}
  # {error} {reason}. Set a key to [] to stay silent; omit it to use the built-in default.
  messages:
    searching:
      - "🔎 Ooh, music! Diggin' up “{query}” on the ol' YouTube…"
      - "🔎 Say no more! Huntin' down “{query}”…"
    # Keep the bare {url} on its own line - Discord turns it into a video embed. (These
    # overrides REPLACE the defaults in voice.py, so the link has to be repeated here.)
    now_playing:
      - "🎶 Now spinnin': **{title}** [{duration}] — for {user}. Kronk-tacular choice!\n{url}"
      - "🎶 Here we go! **{title}** [{duration}], picked by {user}.\n{url}"
    queued:
      - "➕ Lined up **{title}** [{duration}] — you're #{position}. Patience, my friend."
    skipped:
      - "⏭️ Yeah okay, **{title}** wasn't it. Movin' on!"
    stopped:
      - "⏹️ Music's off and the list is wiped. Silence! Kronk-style."
    left:
      - "👋 Kronk out! Poppin' outta the voice channel."
    idle_left:
      - "👋 Nothin' left to play, so I'm headin' out. Later!"
    not_in_voice:
      - "Ya gotta be IN a voice channel first, buddy. I can't play to an empty room."
    nothing_playing:
      - "I ain't playin' anything right now. Kinda quiet, huh?"
    no_results:
      - "Hmm. Searched high and low, found zilch for “{query}”. Weird."
    too_long:
      - "Whoa, {duration}?! That's a whole afternoon. My limit's {limit}."
    playback_failed:
      - "⚠️ Uh oh. I found **{title}** but couldn't actually play it — {error}"

# Tool calling
# The main model natively decides when to call tools, runs them, and can chain calls.
# Max rounds of tool calls before the bot is forced to give a final answer.
max_tool_rounds: 5

# Context window in tokens. MUST be set: Ollama's own default is 4096, and the system prompt
# (~1800 tokens) plus the tool schemas (~1400 for 18 tools) fill 78% of that before a single
# message of conversation. On overflow Ollama truncates from the front - dropping the system
# prompt's "you MUST call the tool" rules - and the model starts acting tools out in prose
# ("*changes nickname*") or emitting reasoning with no room left for a reply. Raise it if you
# add tools, lengthen the persona, or store more memory; lower it only to save VRAM.
num_ctx: 16384

# Guard against the model SAYING it did something it never did ("Done!", "Reminder set!")
# without emitting the tool call. When a reply claims an action that no tool performed this
# turn, the model gets one corrective round to either call the tool or drop the claim, and the
# incident is logged at WARNING (so it reaches the Discord log channel). Measure how often it
# fires with `uv run python evals/run_evals.py`. Set false to disable the check entirely.
claim_check: true

# Reasoning models (like qwen3.5) do an internal "thinking" pass before replying, which makes
# them noticeably smarter on complex questions. The reasoning goes in a separate field and is
# NEVER posted to chat (and any inline <think> tags are stripped as a safety net). While it's
# thinking, a "Kronking..." placeholder is shown so the delay isn't dead air.
use_thinking: true

# Placeholder posted while the model is thinking (only used when use_thinking is true). It's
# deleted once the real reply is ready. Set to "" to show nothing (the typing indicator still runs).
thinking_message: "🤔 Kronking…"

# Default timezone
# Used with the timezone package.
default_timezone: "Europe/London"

# Post a short "Looking up X on Wikipedia…" line to the channel before a lookup tool runs,
# so users know the answer draws from a real/deterministic source. Set false to stay silent.
announce_tools: true

# Announcement templates, in Kronk's voice. One variant is picked at random each time for
# variety. Placeholders are filled from the tool's arguments:
#   web_search/wikipedia/recall/queue_song {query}, web_fetch {url}, calculator {expression},
#   get_time {timezone}, get_user_info {name}.
# Set a tool to [] to silence just that one; omit a tool to use the built-in neutral default.
tool_announcements:
  web_search:
    - "🔎 Ooh ooh, hang on — lemme go find “{query}” for ya!"
    - "🔎 Say no more! Hittin' the web for “{query}”…"
    - "🔎 On it! Time to track down “{query}”. This is my jam."
  web_fetch:
    - "🌐 Righto! Crackin' open {url}…"
    - "🌐 Gimme a sec, I'll go read {url} real quick."
  wikipedia:
    - "📖 Ooh, I think I know this one! …okay maybe not. Checkin' Wikipedia for “{query}”…"
    - "📖 To the encyclopedia! Lookin' up “{query}” for ya."
    - "📖 Hang tight, flippin' through the ol' Wikipedia for “{query}”…"
  get_user_info:
    - "🪪 Lemme pull up {name}'s file. I keep tabs, y'know."
    - "🪪 Ooh, peekin' at what I got on {name}…"
  recall:
    - "🧠 Ohh, this is gonna bug me — lemme remember about “{query}”…"
    - "🧠 Hang on hang on, I got this! Searchin' the ol' noggin for “{query}”…"
    - "🧠 Pretty sure I know somethin' about “{query}”. Lemme think…"
  calculator:
    - "🧮 Numbers! My favorite. Crunchin' {expression}…"
    - "🧮 Ooh, math! Lemme work out {expression}…"
  get_time:
    - "🕐 Lemme squint at the ol' clock for {timezone}…"
    - "🕐 One sec, checkin' the time in {timezone}!"
  # Action tools - announce what I'm about to do (placeholders: set_nickname {nickname},
  # set_status {text}, set_reminder {minutes}/{text}, create_poll {question}, start_thread {name}).
  set_nickname:
    - "🏷️ Ooh, new name! Becomin' “{nickname}”…"
    - "🏷️ You got it — changin' my name to “{nickname}”…"
  set_status:
    - "🎭 Switchin' my status to “{text}”…"
  set_reminder:
    - "⏰ On it! Settin' a reminder for {minutes} min…"
    - "⏰ Timer time! {minutes} min, comin' right up…"
  create_poll:
    - "📊 Ooh, a poll! Puttin' up “{question}”…"
  start_thread:
    - "🧵 Startin' up a thread: “{name}”…"
  queue_song:
    - "🎵 Ooh, music! Lemme go grab “{query}”…"
    - "🎵 On it! Cueing up “{query}” for ya."
  remember_fact:
    - "📝 Ooh, good to know — jottin' that in the ol' memory banks…"
    - "📝 Noted! Lockin' that one in…"

# Per-tool on/off switches. Requirements noted in comments still apply even if set true:
#   - web_search / web_fetch need the OLLAMA_API_KEY env var
#   - remember_fact / recall need memory.do_memory: true
#   - Discord action tools (reactions, nickname, polls…) need the matching bot permissions
tools:
  # Web (require OLLAMA_API_KEY) - enabled here, but only activate when the key is set
  web_search: true
  web_fetch: true
  # Fun / social
  roll_dice: true
  flip_coin: true
  random_choice: true
  set_reminder: true
  queue_song: true   # needs the voice feature working (see `voice:` below)
  create_poll: true
  start_thread: true
  # Knowledge / utility
  wikipedia: true
  calculator: true
  get_time: true
  # Embodiment / presence
  add_reaction: true
  set_status: true
  set_nickname: true
  set_about: true
  get_user_info: true
  # Memory (require memory.do_memory: true)
  remember_fact: true
  recall: true
