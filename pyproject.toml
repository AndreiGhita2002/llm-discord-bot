[project]
name = "llm-discord-bot"
version = "0.2.3"
description = "LLM based discord bot. Optimised for entartained and mimicking human responses."
requires-python = ">=3.12"

dependencies = [
    "discord.py>=2.3.0",
    "httpx>=0.27.0",
    "ollama>=0.4.0",
    "pyyaml>=6.0",
    "sqlite-vec>=0.1.0",
    # Voice playback (/play): PyNaCl encrypts the voice stream, yt-dlp resolves YouTube audio.
    # The ffmpeg binary and libopus are system deps (macOS: `brew install ffmpeg`).
    "PyNaCl>=1.5.0",
    "yt-dlp>=2024.8.6",
]
